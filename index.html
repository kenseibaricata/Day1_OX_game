    <footer>
        <table align="center" width="400" bgcolor="white" cellpadding="10" style="margin-top: 20px;">
            <tr>
                <td>
                    <h2 align="center">遊び方</h2>
                    <ol>
                        <li>2人で交互にマスを埋めていきます</li>
                        <li>各マスのプルダウンで○か✕を選びます</li>
                        <li>縦・横・斜めのいずれかで3つ揃えると勝ち！</li>
